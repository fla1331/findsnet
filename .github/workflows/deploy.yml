name: Deploy to Netlify

on:
  schedule:
    - cron: '40 18 */2 * *'  # A cada 2 dias às 15:40 BRT
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar o código
        uses: actions/checkout@v3
      
      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar dependências
        run: pip install -r requirements.txt
      
      - name: Configurar variáveis de ambiente
        run: |
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV
          echo "UNSPLASH_API_KEY=${{ secrets.UNSPLASH_API_KEY }}" >> $GITHUB_ENV
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> $GITHUB_ENV
          echo "PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}" >> $GITHUB_ENV
      
      - name: Executar o gerador
        run: python3 gerador.py --auto
      
      - name: Deploy para Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './docs'
          production-branch: main
          deploy-message: "Publicação automática - $(date +'%d/%m/%Y')"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}