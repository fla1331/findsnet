<!-- ===== HEAD - Universal ===== -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITULO}}</title>
<meta name="description" content="{{DESCRICAO}}" />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="{{URL}}" />

<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e67e22' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/><path d='M2 21c0-3 1.85-5.36 5.08-6'/></svg>" />

<!-- Open Graph -->
<meta property="og:title" content="{{TITULO}}" />
<meta property="og:description" content="{{DESCRICAO}}" />
<meta property="og:url" content="{{URL}}" />
<meta property="og:image" content="{{IMAGEM}}" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{NOME_SITE}}" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{TITULO}}" />
<meta name="twitter:description" content="{{DESCRICAO}}" />
<meta name="twitter:image" content="{{IMAGEM}}" />

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet" />

<!-- CSS -->
<link rel="stylesheet" href="/assets/css/style.css" />
<link rel="stylesheet" href="/assets/css/custom.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />


<!-- HREFLANG (gerado automaticamente) -->
{{EXTRA_HEAD}}

<!-- Schema.org -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{TITULO}}",
  "description": "{{DESCRICAO}}",
  "image": "{{IMAGEM}}",
  "url": "{{URL}}",
  "datePublished": "{{DATA}}",
  "dateModified": "{{DATA}}",
  "author": {
    "@type": "Person",
    "name": "{{AUTOR}}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{NOME_SITE}}"
  }
}
</script>
