<header class="site-header">
  <div class="container header-inner">
    <a href="/{{IDIOMA}}/" class="logo">
      <span class="logo-icon"><img src="/assets/img/icon_logo.avif" alt="{{NOME_SITE}}"></span>
      <span>{{NOME_SITE}}</span>
    </a>
    <nav class="main-nav" id="main-nav" aria-label="Navegação principal">
      <ul class="nav-list">
      <li><a href="/{{IDIOMA}}/" class="active">Home</a></li>           
        {{CATEGORIAS_MENU}}
      </ul>
    </nav>
    <div class="header-actions">
      <div class="lang-selector">
        <button class="lang-btn" aria-haspopup="true" aria-expanded="false" aria-label="Selecionar idioma">
          <span class="lang-flag">🇧🇷</span><span>PT</span><i class="fa-solid fa-chevron-down" style="font-size:0.7rem"></i>
        </button>
        <div class="lang-dropdown" role="menu">
          <a href="/en/" role="menuitem"><span class="lang-flag">🇬🇧</span> English</a>
          <a href="/es/" role="menuitem"><span class="lang-flag">🇪🇸</span> Español</a>
          <a href="/pt/" role="menuitem"><span class="lang-flag">🇧🇷</span> Portuguese</a>
          
          
        </div>
      </div>
      <button class="theme-toggle" aria-label="Alternar tema claro/escuro">
        <i class="fa-solid fa-sun icon-sun"></i>
        <i class="fa-solid fa-moon icon-moon"></i>
      </button>
      <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
